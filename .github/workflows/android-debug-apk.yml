name: CY01 Android Debug APK

on:
  push:
    branches:
      - lab/cy01-stream-apk
      - main
  pull_request:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Prepare v0.6 package and resilient P2P test UI
        run: |
          python3 - <<'PY'
          from pathlib import Path

          gradle = Path('app/build.gradle')
          s = gradle.read_text()
          s = s.replace("applicationId 'com.vk.cy01streamlab'", "applicationId 'com.vk.cy01streamlab6'")
          s = s.replace("applicationIdSuffix '.debug'", "")
          s = s.replace("versionCode 2", "versionCode 600")
          s = s.replace("versionName '0.2.0'", "versionName '0.6.0'")
          gradle.write_text(s)

          activity = Path('app/src/main/java/com/vk/cy01streamlab/MainActivityV03.java')
          s = activity.read_text()
          s = s.replace('CY01 Stream Lab v0.3 started', 'CY01 Stream Lab v0.6 started')
          s = s.replace('CY01 Stream Lab v0.3', 'CY01 Stream Lab v0.6')
          s = s.replace('v0.3: no explicit Android Network binding', 'v0.6: no explicit Android Network binding')
          s = s.replace('v0.3 will NOT bind sockets', 'v0.6 will NOT bind sockets')

          needle = '        box.addView(button("PROBE NOW", v -> runBaseProbeSuite()));\n'
          insert = needle + '        box.addView(button("3. SHOW RTSP VIDEO", v -> startActivity(new Intent(MainActivityV03.this, RtspPlayerActivity.class))));\n'
          if needle not in s:
              raise SystemExit('PROBE NOW insertion point not found')
          s = s.replace(needle, insert, 1)

          s = s.replace('Preview auto-stops after 60 seconds.', 'Preview auto-stops after 180 seconds.')
          s = s.replace('main.postDelayed(autoStopRunnable, 60000);', 'main.postDelayed(autoStopRunnable, 180000);')

          field = '    private Runnable autoStopRunnable;\n'
          if field not in s:
              raise SystemExit('autoStop field insertion point not found')
          s = s.replace(field, field + '    private Runnable p2pConnectWatchdog;\n', 1)

          old_fallback = '''        log("Waiting up to 5 s for the 0x14 ACK before fallback P2P discovery");

        main.postDelayed(() -> {
            if (!previewAckSeen && !p2pConnected) {
                log("No preview ACK after 5 s; using fallback P2P discovery");
                beginP2pDiscovery("fallback timer");
            }
        }, 5000);'''
          new_fallback = '''        log("Waiting up to 7 s for the 0x14 ACK before fallback P2P discovery");

        main.postDelayed(() -> {
            if (!previewAckSeen && !p2pConnected) {
                log("No preview ACK after 7 s; using fallback P2P discovery");
                beginP2pDiscovery("fallback timer");
            }
        }, 7000);'''
          if old_fallback not in s:
              raise SystemExit('fallback timer block not found')
          s = s.replace(old_fallback, new_fallback, 1)

          old_connect_success = '''                public void onSuccess() {
                    log("Wi-Fi Direct connect requested");
                }'''
          new_connect_success = '''                public void onSuccess() {
                    log("Wi-Fi Direct connect requested; watchdog armed for 8 s");
                    armP2pConnectWatchdog();
                }'''
          if old_connect_success not in s:
              raise SystemExit('connect success block not found')
          s = s.replace(old_connect_success, new_connect_success, 1)

          marker = '    private void requestConnectionInfo() {\n'
          watchdog_method = '''    private void armP2pConnectWatchdog() {
        if (p2pConnectWatchdog != null) main.removeCallbacks(p2pConnectWatchdog);
        p2pConnectWatchdog = () -> {
            if (p2pConnected || p2pManager == null || p2pChannel == null) return;
            log("P2P connect watchdog: group not formed after 8 s; checking connection state");
            p2pManager.requestConnectionInfo(p2pChannel, info -> {
                if (info != null && info.groupFormed) {
                    log("P2P watchdog found a formed group; resuming normal flow");
                    onConnectionInfo(info);
                    return;
                }
                log("P2P watchdog confirmed no group; cancelling stalled negotiation");
                p2pManager.cancelConnect(p2pChannel, new WifiP2pManager.ActionListener() {
                    @Override
                    public void onSuccess() {
                        log("Stalled P2P negotiation cancelled; retrying discovery");
                        retryP2pAfterStall();
                    }

                    @Override
                    public void onFailure(int reason) {
                        log("cancelConnect result=" + p2pReason(reason) + " (" + reason + "); retrying anyway");
                        retryP2pAfterStall();
                    }
                });
            });
        };
        main.postDelayed(p2pConnectWatchdog, 8000);
    }

    private void retryP2pAfterStall() {
        p2pConnectIssued = false;
        p2pConnected = false;
        p2pSessionHandled = false;
        p2pDiscoveryStarted = false;
        if (p2pConnectWatchdog != null) {
            main.removeCallbacks(p2pConnectWatchdog);
            p2pConnectWatchdog = null;
        }
        main.postDelayed(() -> beginP2pDiscovery("connect watchdog retry"), 900);
    }

'''
          if marker not in s:
              raise SystemExit('requestConnectionInfo marker not found')
          s = s.replace(marker, watchdog_method + marker, 1)

          formed_marker = '''        String owner = info.groupOwnerAddress == null ? "?" : info.groupOwnerAddress.getHostAddress();'''
          formed_insert = '''        if (p2pConnectWatchdog != null) {
            main.removeCallbacks(p2pConnectWatchdog);
            p2pConnectWatchdog = null;
            log("P2P connect watchdog cancelled: group formed");
        }

''' + formed_marker
          if formed_marker not in s:
              raise SystemExit('formed group marker not found')
          s = s.replace(formed_marker, formed_insert, 1)

          stop_marker = '''        if (bleReady) {
            log("Stopping preview [02 01 15 01]");'''
          stop_insert = '''        if (p2pConnectWatchdog != null) {
            main.removeCallbacks(p2pConnectWatchdog);
            p2pConnectWatchdog = null;
        }
        if (bleReady) {
            log("Stopping preview [02 01 15 01]");'''
          if stop_marker not in s:
              raise SystemExit('stop marker not found')
          s = s.replace(stop_marker, stop_insert, 1)

          destroy_marker = '''        if (autoStopRunnable != null) main.removeCallbacks(autoStopRunnable);'''
          destroy_insert = destroy_marker + '''
        if (p2pConnectWatchdog != null) main.removeCallbacks(p2pConnectWatchdog);'''
          if destroy_marker not in s:
              raise SystemExit('destroy marker not found')
          s = s.replace(destroy_marker, destroy_insert, 1)

          activity.write_text(s)
          PY
          grep -n "applicationId\|versionCode\|versionName" app/build.gradle
          grep -n "SHOW RTSP VIDEO\|v0.6 started\|180000\|watchdog\|No preview ACK after 7" app/src/main/java/com/vk/cy01streamlab/MainActivityV03.java
          grep -n "testStream\|v0.5 started" app/src/main/java/com/vk/cy01streamlab/RtspPlayerActivity.java
          grep -n "RtspPlayerActivity" app/src/main/AndroidManifest.xml

      - name: Set up Java 17
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3

      - name: Install Android 35 SDK
        run: sdkmanager 'platforms;android-35' 'build-tools;35.0.0'

      - name: Set up Gradle 8.10.2
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.10.2'

      - name: Build debug APK
        run: gradle --stacktrace :app:assembleDebug

      - name: Verify APK structure and signature
        run: |
          APK=app/build/outputs/apk/debug/app-debug.apk
          "$ANDROID_HOME/build-tools/35.0.0/apksigner" verify --verbose --print-certs "$APK"
          "$ANDROID_HOME/build-tools/35.0.0/aapt2" dump badging "$APK" | head -24
          unzip -t "$APK"

      - name: Enable KVM
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm

      - name: Android 16 install and launcher smoke test
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 36
          arch: x86_64
          profile: pixel_6
          disable-animations: true
          script: |
            adb install -r app/build/outputs/apk/debug/app-debug.apk
            adb shell pm path com.vk.cy01streamlab6
            adb shell am start -W -n com.vk.cy01streamlab6/com.vk.cy01streamlab.MainActivityV03
            sleep 2
            adb shell dumpsys activity activities | grep -m1 'MainActivityV03'

      - name: Upload debug APK
        uses: actions/upload-artifact@v4
        with:
          name: cy01-stream-lab-v0.6.0-p2p-watchdog-teststream-android16-tested
          path: app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
