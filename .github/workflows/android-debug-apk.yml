name: CY01 Android Debug APK

on:
  push:
    branches:
      - lab/cy01-stream-apk
      - main
  pull_request:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Prepare v0.4 package and test UI
        run: |
          python3 - <<'PY'
          from pathlib import Path

          gradle = Path('app/build.gradle')
          s = gradle.read_text()
          s = s.replace("applicationId 'com.vk.cy01streamlab'", "applicationId 'com.vk.cy01streamlab4'")
          s = s.replace("applicationIdSuffix '.debug'", "")
          s = s.replace("versionCode 2", "versionCode 400")
          s = s.replace("versionName '0.2.0'", "versionName '0.4.0'")
          gradle.write_text(s)

          activity = Path('app/src/main/java/com/vk/cy01streamlab/MainActivityV03.java')
          s = activity.read_text()
          s = s.replace('CY01 Stream Lab v0.3 started', 'CY01 Stream Lab v0.4 started')
          s = s.replace('CY01 Stream Lab v0.3', 'CY01 Stream Lab v0.4')
          s = s.replace('v0.3: no explicit Android Network binding', 'v0.4: no explicit Android Network binding')
          s = s.replace('v0.3 will NOT bind sockets', 'v0.4 will NOT bind sockets')
          needle = '        box.addView(button("PROBE NOW", v -> runBaseProbeSuite()));\n'
          insert = needle + '        box.addView(button("3. SHOW RTSP VIDEO", v -> startActivity(new Intent(MainActivityV03.this, RtspPlayerActivity.class))));\n'
          if needle not in s:
              raise SystemExit('PROBE NOW insertion point not found')
          s = s.replace(needle, insert, 1)
          s = s.replace('Preview auto-stops after 60 seconds.', 'Preview auto-stops after 180 seconds.')
          s = s.replace('main.postDelayed(autoStopRunnable, 60000);', 'main.postDelayed(autoStopRunnable, 180000);')
          activity.write_text(s)
          PY
          grep -n "applicationId\|versionCode\|versionName" app/build.gradle
          grep -n "SHOW RTSP VIDEO\|v0.4 started\|180000" app/src/main/java/com/vk/cy01streamlab/MainActivityV03.java

      - name: Set up Java 17
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3

      - name: Install Android 35 SDK
        run: sdkmanager 'platforms;android-35' 'build-tools;35.0.0'

      - name: Set up Gradle 8.10.2
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.10.2'

      - name: Build debug APK
        run: gradle --stacktrace :app:assembleDebug

      - name: Verify APK structure and signature
        run: |
          APK=app/build/outputs/apk/debug/app-debug.apk
          "$ANDROID_HOME/build-tools/35.0.0/apksigner" verify --verbose --print-certs "$APK"
          "$ANDROID_HOME/build-tools/35.0.0/aapt2" dump badging "$APK" | head -24
          "$ANDROID_HOME/build-tools/35.0.0/aapt2" dump xmltree "$APK" AndroidManifest.xml | grep -m1 'RtspPlayerActivity'
          unzip -t "$APK"

      - name: Enable KVM
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm

      - name: Android 16 install and launcher smoke test
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 36
          arch: x86_64
          profile: pixel_6
          disable-animations: true
          script: |
            adb install -r app/build/outputs/apk/debug/app-debug.apk
            adb shell pm path com.vk.cy01streamlab4
            adb shell am start -W -n com.vk.cy01streamlab4/com.vk.cy01streamlab.MainActivityV03
            sleep 2
            adb shell dumpsys activity activities | grep -m1 'MainActivityV03'

      - name: Upload debug APK
        uses: actions/upload-artifact@v4
        with:
          name: cy01-stream-lab-v0.4.0-rtsp-player-android16-tested
          path: app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
