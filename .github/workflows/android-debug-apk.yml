name: CY01 Android Debug APK

on:
  push:
    branches:
      - lab/cy01-stream-apk
      - main
  pull_request:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Prepare v2.3 RTSP framing and recovery
        run: |
          python3 tools/prepare_v19.py
          python3 tools/prepare_v23.py

      - name: Verify v2.3 source preparation
        run: |
          grep -n "applicationId\|versionCode\|versionName" app/build.gradle
          grep -n "v2.3 started\|MIC->CAMERA recovery\|RTSP_HOST" app/src/main/java/com/vk/cy01streamlab/MainActivityV03.java
          grep -n "CY01 LIVE v2.3\|RTSP response race\|pollCameraRecoveryReady\|smooth rtpMaxGapMs\|SETUP track2 AUDIO\|START MIC TEST" app/src/main/java/com/vk/cy01streamlab/RawRtspH264Activity.java
          grep -n "RawRtspH264Activity\|RtspPlayerActivity" app/src/main/AndroidManifest.xml

      - name: Set up Java 17
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'

      - name: Use preinstalled Android SDK
        run: |
          echo "ANDROID_HOME=/usr/local/lib/android/sdk" >> "$GITHUB_ENV"
          echo "ANDROID_SDK_ROOT=/usr/local/lib/android/sdk" >> "$GITHUB_ENV"
          echo "/usr/local/lib/android/sdk/platform-tools" >> "$GITHUB_PATH"
          echo "/usr/local/lib/android/sdk/cmdline-tools/latest/bin" >> "$GITHUB_PATH"

      - name: Install Android 35 SDK
        run: /usr/local/lib/android/sdk/cmdline-tools/latest/bin/sdkmanager 'platforms;android-35' 'build-tools;35.0.0'

      - name: Set up Gradle 8.10.2
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.10.2'

      - name: Build debug APK
        run: gradle --stacktrace :app:assembleDebug

      - name: Verify APK structure and signature
        run: |
          APK=app/build/outputs/apk/debug/app-debug.apk
          "$ANDROID_HOME/build-tools/35.0.0/apksigner" verify --verbose --print-certs "$APK"
          "$ANDROID_HOME/build-tools/35.0.0/aapt2" dump badging "$APK" | head -24
          unzip -t "$APK"

      - name: Enable KVM
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm

      - name: Android 16 install and launcher smoke test
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 36
          arch: x86_64
          profile: pixel_6
          disable-animations: true
          script: |
            adb install -r app/build/outputs/apk/debug/app-debug.apk
            adb shell pm path com.vk.cy01streamlab23
            adb shell am start -W -n com.vk.cy01streamlab23/com.vk.cy01streamlab.MainActivityV03
            sleep 2
            adb shell dumpsys activity activities | grep -m1 'MainActivityV03'

      - name: Upload debug APK
        if: always() && hashFiles('app/build/outputs/apk/debug/app-debug.apk') != ''
        uses: actions/upload-artifact@v4
        with:
          name: cy01-live-v2.3.0-rtsp-race-recovery-android16-tested
          path: app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
