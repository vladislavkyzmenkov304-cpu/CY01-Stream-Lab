name: CY01 Android Debug APK

on:
  push:
    branches:
      - lab/cy01-stream-apk
      - main
  pull_request:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Prepare clean package identity
        run: |
          python3 - <<'PY'
          from pathlib import Path
          p = Path('app/build.gradle')
          s = p.read_text()
          s = s.replace("applicationId 'com.vk.cy01streamlab'", "applicationId 'com.vk.cy01streamlab3'")
          s = s.replace("applicationIdSuffix '.debug'", "")
          s = s.replace("versionCode 2", "versionCode 300")
          s = s.replace("versionName '0.2.0'", "versionName '0.3.0'")
          p.write_text(s)
          PY
          grep -n "applicationId\|versionCode\|versionName" app/build.gradle

      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3

      - name: Install Android 35 SDK
        run: sdkmanager 'platforms;android-35' 'build-tools;35.0.0'

      - name: Set up Gradle 8.10.2
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.10.2'

      - name: Build debug APK
        run: gradle --stacktrace :app:assembleDebug

      - name: Verify APK structure and signature
        run: |
          APK=app/build/outputs/apk/debug/app-debug.apk
          "$ANDROID_HOME/build-tools/35.0.0/apksigner" verify --verbose --print-certs "$APK"
          "$ANDROID_HOME/build-tools/35.0.0/aapt2" dump badging "$APK" | head -20
          unzip -t "$APK"

      - name: Enable KVM
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm

      - name: Android 16 package-manager install smoke test
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 36
          arch: x86_64
          profile: pixel_6
          disable-animations: true
          script: |
            adb install -r app/build/outputs/apk/debug/app-debug.apk
            adb shell pm path com.vk.cy01streamlab3

      - name: Upload debug APK
        uses: actions/upload-artifact@v4
        with:
          name: cy01-stream-lab-v0.3.0-direct-route-android16-tested
          path: app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
